name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

# Read-only by default. Only the release job, which publishes, gets contents: write, so
# the CI gate it calls never holds a write token.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to a full commit SHA, as in ci.yml. persist-credentials false: git archive
      # needs no token, and the curl | sh installer below runs in this write-holding job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-pinned: a tag can be moved)
        with:
          persist-credentials: false

      - name: Verify version consistency
        # VERSION is the single source of truth; cyrius.cyml derives it
        # via version = "${file:VERSION}". Both must equal the pushed tag
        # (matches patra / sigil).
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          TAG="${GITHUB_REF_NAME}"
          [ "$FILE_VERSION" = "$TAG" ] || { echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          [ "$CYML_VERSION" = "$TAG" ] || { echo "cyrius.cyml ($CYML_RAW) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyml: $CYML_RAW)"

      - name: Install Cyrius toolchain
        # Canonical installer — see ci.yml for rationale.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Bundle is current
        # Publish the committed bundle, the bytes `cyrius deps` gives consumers from this
        # tag, and refuse to release if it lags src/ (CI's gate checked the same).
        run: cyrius distlib --check

      - name: Extract changelog
        # Pull the tagged section out of CHANGELOG.md for the release body.
        run: |
          TAG="${GITHUB_REF_NAME}"
          BODY=$(awk "/^## \\[$TAG\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          [ -n "$BODY" ] || BODY="No changelog entry for $TAG."
          echo "$BODY" > /tmp/release-body.md

      - name: Source tarball + checksums
        # The source tarball + SHA256SUMS are what `cyrius deps` fetches and
        # sha256-verifies downstream — without them this project cannot be
        # consumed as a dependency. This is the release artifact, not just
        # the built binary.
        # From 0.3.0 the distlib bundle and its .deps sidecar also ship as standalone,
        # version-stamped assets (the bytes `cyrius distlib --check` just verified).
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          NAME="${{ github.event.repository.name }}"
          git archive --format=tar.gz --prefix="$NAME-$TAG/" -o "$NAME-$TAG.tar.gz" HEAD
          cp "dist/$NAME.cyr" "$NAME-$TAG.cyr"
          cp "dist/$NAME.deps" "$NAME-$TAG.deps"
          sha256sum "$NAME-$TAG.tar.gz" "$NAME-$TAG.cyr" "$NAME-$TAG.deps" build/"$NAME" > SHA256SUMS

      - name: Create release
        # The one step that uses the write token, so it is pinned to a full commit SHA.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: "${{ github.event.repository.name }} ${{ github.ref_name }}"
          body_path: /tmp/release-body.md
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz
            ${{ github.event.repository.name }}-${{ github.ref_name }}.cyr
            ${{ github.event.repository.name }}-${{ github.ref_name }}.deps
            SHA256SUMS
            build/${{ github.event.repository.name }}
